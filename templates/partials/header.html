{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo-240.png')}" alt="Mr Frankie Cafe" width="240" height="229">
      <img class="logo-dark" src="{=site.url('images/logo-dark-240.png')}" alt="" aria-hidden="true" width="240" height="229">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url}">Home</a></li>
        <li><a href="{=site.url('about')}">About Us</a></li>
        <li>
          <a href="{=site.url('menus')}">Our Menus</a>
          <ul>
            <li><a href="{=site.url('menus/by-day')}">By Day</a></li>
            <li><a href="{=site.url('menus/by-night')}">By Night</a></li>
            <li><a href="{=site.url('menus/drinks')}">Drinks</a></li>
          </ul>
        </li>
        <li><a href="{=site.url('contact')}">Contact Us</a></li>
        <li><a class="btn-book" href="mailto:bookings@mrfrankie.com.au">Book now</a></li>
      </ul>
    </nav>
  </div>
</header>
