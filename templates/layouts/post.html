---
layout: default
---
{@io.quarkiverse.roq.frontmatter.runtime.model.DocumentPage page}
{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<section class="page-banner">
  <div class="container">
    <p class="eyebrow">News</p>
    <h1>{=page.title}</h1>
  </div>
</section>
<article class="section">
  <div class="container prose">
    <p class="muted"><time datetime="{=page.date.isoDate}">{=page.date.format('d MMMM yyyy')}</time></p>
    {#insert /}
    <p><a href="{=site.url('posts')}">&larr; All news</a></p>
  </div>
</article>
