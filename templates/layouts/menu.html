---
layout: default
---
{@io.quarkiverse.roq.frontmatter.runtime.model.Page page}
{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<section class="page-banner">
  <div class="container">
    <p class="eyebrow">Our menus</p>
    <h1>{=page.title}</h1>
    {#if page.description}<p class="lead">{=page.description}</p>{/if}
    {#if page.data.pdf??}
    <p class="menu-actions">
      <a class="btn btn-primary" href="{=site.url(page.data.pdf)}" download>Download the {=page.title} menu (PDF)</a>
    </p>
    {/if}
  </div>
</section>
<section class="section menu-page">
  <div class="container">
    {#insert /}
  </div>
</section>
