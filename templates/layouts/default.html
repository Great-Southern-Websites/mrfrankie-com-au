{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {#seo page site /}
  <link rel="icon" href="{=site.url('favicon.png')}" type="image/png">
  <link rel="apple-touch-icon" href="{=site.url('favicon.png')}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600&display=swap">
  <script>{|
    try {
      var t = localStorage.getItem('site-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* private mode: follow the OS preference */ }
  |}</script>
  <link rel="stylesheet" href="{=site.url('css/main.css')}">
  {#insert head /}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {#include partials/header /}
  <main id="main">
  {#insert /}
  </main>
  {#include partials/footer /}
  {#include partials/theme-toggle /}
</body>
</html>
