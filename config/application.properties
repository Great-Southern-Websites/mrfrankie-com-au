# Site configuration. site.url is left unset on purpose: the Roq GitHub Action
# derives the GitHub Pages URL (including the /repo-name/ path) from the
# repository. website-builder sets it when a custom domain is connected.
quarkus.qute.alt-expr-syntax=true

# Optional news/blog collection: markdown files under content/posts/
site.collections.posts.layout=post

quarkus.roq.generator.timeout=120
